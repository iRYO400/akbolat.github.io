# Akbolat's Workshop: plain Hugo, no theme and no modules (layouts/ and assets/ live in this repo).
baseURL: 'https://sadvakassov.com/'
title: Akbolat's Workshop
locale: en-us
defaultContentLanguage: en
enableRobotsTXT: true
enableEmoji: true
summaryLength: 30

# Tags are only text on a post, there are no tag or category pages.
disableKinds: [taxonomy, term]

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

pagination:
  pagerSize: 10

sitemap:
  changeFreq: monthly
  priority: 0.5

imaging:
  resampleFilter: lanczos
  jpeg:
    quality: 85
  webp:
    quality: 85

markup:
  highlight:
    codeFences: true
    noClasses: false   # Chroma colours come from assets/css/chroma-*.css
    lineNos: false
