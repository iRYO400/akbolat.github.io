{{- /* Hero depth: scrolling moves the floor, the halo and the phones at different speeds, and on a mouse the
       layers follow the pointer a little. Writes --p (0..1 scrolled through the hero), --mx and --my (-1..1).
       Off under prefers-reduced-motion; without JS the hero simply stands still. */ -}}
<script>(function(){var h=document.querySelector('.hero');if(!h||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var tx=0,ty=0,cx=0,cy=0,raf=0,s=h.style;
function frame(){raf=0;var r=h.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/r.height));
cx+=(tx-cx)*.12;cy+=(ty-cy)*.12;s.setProperty('--p',p.toFixed(4));s.setProperty('--mx',cx.toFixed(4));s.setProperty('--my',cy.toFixed(4));
if(Math.abs(tx-cx)>.001||Math.abs(ty-cy)>.001)ask()}
function ask(){if(!raf)raf=requestAnimationFrame(frame)}
addEventListener('scroll',ask,{passive:true});addEventListener('resize',ask);
if(matchMedia('(pointer: fine)').matches){h.addEventListener('pointermove',function(e){var r=h.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*2-1;ty=(e.clientY-r.top)/r.height*2-1;ask()});
h.addEventListener('pointerleave',function(){tx=ty=0;ask()})}
ask();})();</script>
