{{- /* Slide-in of the plates and the parallax of their pictures; both stand down under prefers-reduced-motion. */ -}}
<script>(function(){var d=document.documentElement;if(!d.classList.contains('js-motion'))return;
clearTimeout(window.__burstFallback);
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;io.unobserve(e.target);var li=e.target;
requestAnimationFrame(function(){requestAnimationFrame(function(){li.classList.add('is-in')})})})},{threshold:.15});
document.querySelectorAll('.stack__list > li').forEach(function(li){io.observe(li)});})();</script>
<script>(function(){var ps=[].slice.call(document.querySelectorAll('.plate'));
if(!ps.length||!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var on=[],raf=0;
function step(){raf=0;var h=innerHeight;on.forEach(function(el){var r=el.getBoundingClientRect();
var p=(r.top+r.height/2-h/2)/(h/2+r.height/2);el.style.setProperty('--p',Math.max(-1,Math.min(1,p)).toFixed(4))})}
function ask(){if(!raf)raf=requestAnimationFrame(step)}
var io=new IntersectionObserver(function(es){es.forEach(function(e){var i=on.indexOf(e.target);
if(e.isIntersecting&&i<0)on.push(e.target);else if(!e.isIntersecting&&i>=0)on.splice(i,1)});ask()},{rootMargin:'120px 0px'});
ps.forEach(function(el){io.observe(el)});addEventListener('scroll',ask,{passive:true});addEventListener('resize',ask);})();</script>
